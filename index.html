<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Profile Card</title>
</head>
<body>
    <div class="card">
        <div class="notification">🔔</div>
        <div class="profile">
            <img src="images/profile.jpg" alt="Profile Photo">
        </div>
        <div class="name">Abirami</div>
        <div class="email">
            📧 <span id="emailText">abi@gmail.com</span>
        </div>
        <button id="copyBtn" type="button"> 📋Copy</button>
        <div class="role">CSE Student</div>
        <div class="skills">
            <span class="HTML">HTML</span>
            <span class="CSS">CSS</span>
            <span class="git">Git</span>
        </div>
        <div class = "socials">
            <a href="https://github.com/Abirami-r-cse" target="_blank">🐙 GitHub</a>
             <a href="https://www.linkedin.com/in/abirami-r-cse" target="_blank">💼 LinkedIn</a>
        </div>
        <button id="themeBtn">🌙 Dark Mode</button>
        <button class="button" id="followBtn" type="button">Follow ⭐</button>
    </div>
    <script src="script.js"></script>
</body>
